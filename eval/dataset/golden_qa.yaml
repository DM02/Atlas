# Golden evaluation dataset for Atlas (docs/EVALUATION.md, docs/ARCHITECTURE.md §9).
#
# Versioned here (not a DB table) so it's reviewable in PRs like code — the
# same "keep it in git, not the DB" reasoning as document permission grants.
# Only *run results* (EvaluationRun/EvaluationResult) persist to Postgres.
#
# Schema per entry:
#   id: stable identifier, used in reports
#   question: the natural-language query
#   answerable: whether the corpus actually contains the answer
#   expected_answer_contains: key phrases a correct answer should mention
#     (substring match, case-insensitive — a deliberately simple proxy for
#     answer correctness; see eval/metrics/generation.py for why)
#   expected_source_documents: which corpus files should be cited. Ground
#     truth is at DOCUMENT granularity, not chunk-ID granularity, on purpose:
#     chunk IDs differ across chunking strategies (that's the whole point of
#     comparing them), so document-level relevance is what stays comparable
#     across every experiment configuration in this project.
#   expected_source_sections: which section headings (## markers in the
#     corpus files) are relevant — an additional signal, only meaningfully
#     checkable against structure-aware chunking's section_title tagging.
#
# Known limitation (see docs/EVALUATION.md "Limitations"): 30 questions is
# below the ~50-100 target docs/ARCHITECTURE.md §10 risk 6 named as ideal for
# statistical confidence. Kept intentionally small and hand-reviewable for a
# single-session portfolio build; expanding it is a natural next step.

- id: q001
