# Single entrypoint on :80 in front of the frontend (Vite dev server, :5173)
# and backend (FastAPI, :8000) containers — the Phase 7 "delivery" piece
# ARCHITECTURE.md's repo layout already anticipated (infra/nginx/) but never
# built until now.
#
# Honest limitation: the frontend's own API calls still go directly to
# VITE_API_URL (baked in at build/dev-server start, currently
# http://localhost:8000 — see docker-compose.yml), not through this proxy's
# /api/ location. Making the SPA itself route through nginx would mean
# defaulting VITE_API_URL to a relative path, which breaks the
# already-documented direct-access workflow (:5173 talking straight to
# :8000, CORS-enabled) that the rest of this project's docs assume. So both
# access paths work today — http://localhost (via nginx) and
# http://localhost:5173 (direct) — but only direct access is what the
# frontend bundle itself actually calls; nginx's /api/ and /health here are
# real and independently testable (curl http://localhost/api/v1/... works),
# just not yet the path the browser UI uses internally.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Vite's dev server needs its HMR websocket upgraded through the proxy,
    # or the frontend falls into the same "stale tab, clicks stop working"
    # state documented elsewhere in this project's history whenever the
    # underlying container restarts.
    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
