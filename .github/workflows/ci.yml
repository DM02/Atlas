name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Enable pgvector extension
        run: PGPASSWORD=atlas psql -h localhost -U atlas -d atlas -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Phase 7: the actual "fresh clone -> docker compose up -> working demo"
  # exit criterion, not just isolated lint/test in each subproject. Uses
  # placeholder API keys, not real secrets -- nothing here calls the LLM or
  # embedding providers, only boot + migrations + a real DB-backed endpoint,
  # so this job needs no repo secrets and runs the same for PRs from forks.
  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder .env for the compose stack
        run: |
          cat > .env <<'EOF'
          OPENAI_API_KEY=sk-ci-placeholder-not-a-real-key
          OPENROUTER_API_KEY=sk-or-v1-ci-placeholder-not-a-real-key
          ENVIRONMENT=development
          EOF

      - name: Build and start the full stack
        working-directory: infra
        run: docker compose up -d --build

      - name: Wait for the stack to answer through nginx
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost/health; then
              echo "" && echo "stack is up after $i attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "stack never became healthy" >&2
          exit 1

      - name: Real DB-backed smoke test (migrations ran, registration works)
        run: |
          curl -sf http://localhost/health/ready
          curl -sf -X POST http://localhost/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke-test@example.com","password":"correct horse battery staple"}'

      - name: Dump service logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v
